map $http_upgrade $colossusx_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name colossusx.make-cph-great-again.community 213.199.33.3;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://colossusx.make-cph-great-again.community$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name colossusx.make-cph-great-again.community;

    ssl_certificate /etc/letsencrypt/live/colossusx.make-cph-great-again.community/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/colossusx.make-cph-great-again.community/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ColossusXTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $colossusx_connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
