map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Preserve HTTPS supplied by the host Nginx reverse proxy.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https https;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream colossusx_backend {
    zone colossusx_backend 64k;
    server backend:4000 resolve;
}

upstream colossusx_frontend {
    zone colossusx_frontend 64k;
    server frontend:3000 resolve;
}

upstream colossusx_stats {
    zone colossusx_stats 64k;
    server stats:8050 resolve;
}

# Use one public origin for browser requests after the IP reachability check.
server {
    listen 80;
    server_name 213.199.33.3;
    return 308 https://colossusx.make-cph-great-again.community$request_uri;
}

server {
    listen 80 default_server;
    server_name colossusx.make-cph-great-again.community _;
    absolute_redirect off;
    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;

    error_page 503 /maintenance.html;

    location = /maintenance.html {
        internal;
        root /usr/share/nginx/html/network-info;
        add_header Retry-After 60 always;
    }

    location = /legal {
        return 302 /legal/;
    }

    location = /source {
        return 302 /source/;
    }

    location ^~ /legal/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; base-uri 'none'; frame-ancestors 'self'" always;
    }

    location ^~ /source/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; base-uri 'none'; frame-ancestors 'self'" always;
    }

    location = /network-info {
        return 302 /network-info/;
    }

    # Serve the reviewed mascot bundle independently of the frontend's
    # HTTP-only favicon generator, which cannot read our file:// logo URLs.
    location ^~ /assets/favicon/ {
        alias /usr/share/nginx/html/colossusx-favicons/;
        if_modified_since off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }

    location = /favicon.ico {
        alias /usr/share/nginx/html/colossusx-favicons/favicon.ico;
        if_modified_since off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }

    location ^~ /network-info/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://test2.make-cph-great-again.community; img-src 'self' data:; base-uri 'none'; frame-ancestors 'self'; form-action 'self'" always;
    }

    location ^~ /stats-service/ {
        proxy_pass http://colossusx_stats/;
    }

    location ~ ^/(api(?!-docs$)|socket|sitemap\.xml|auth/) {
        proxy_pass http://colossusx_backend;
    }

    location / {
        if (-f /usr/share/nginx/html/network-info/maintenance.flag) {
            return 503;
        }
        proxy_pass http://colossusx_frontend;
    }
}
